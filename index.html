<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <script src="script.js"></script>
        

        <div id="topbar">
            <h2 style="cursor: pointer" id="welcomeopen">CircuitOS</h2>
            <h2 id="topbarClock">Time</h2>
            <h2 id="topbarDate">Date</h2>
        </div>

        <!--Welcome Screen-->
        <div class="window" id="welcome">
            <div class="windowheader" id="welcomeheader">
                <p style="margin-left: 15px; color: #fff; font-weight: 500">Welcome</p>
                <div class="closebutton" id="welcomeclose"><p>X</p></div>
            </div>

            <h1 style="padding: 6px; border-radius: 8px; background-color: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px); color: #fff; margin: 20px;">Welcome to <strong style="color: blue;">CircuitOS</strong></h1>
            <h2 style="font-size: larger; color: #fff; border-bottom: 2px dashed #fff; border-top: 2px dashed #fff; border-radius: 8px; padding: 8px 16px;">Web-Based Operating System</h2>
            <p style="color: #fff;">A <strong><a href="https://stardance.hackclub.com/projects/47178">Stardance</a></strong> mission.</p>
            <p style="color: #fff;">View <a href="https://github.com/CircuitPhantom/CircuitOS">source</a></p>
        </div>


        <!--ToDoS App-->
        <div class="window" id="todos">
            <div class="windowheader" id="todosheader">
                <p style="margin-left: 15px; color: #fff; font-weight: 500">ToDoS</p>
                <div class="closebutton" id="todosclose"><p>X</p></div>
            </div>
            <div style="background-color: rgba(0, 0, 0, 0.65); margin: 6px; border-radius: 12px; width: fit-content; height: 480px; padding: 16px; font-family: Courier; display: flex;">
                <div style="background-color: rgba(50, 50, 50, 0.8); width: 250px; margin-right: 16px; padding: 16px; border-radius: 16px; color: #fff; display: flex; flex-direction: column;">
                    <p style="margin: 0px;">Today's tasks</p>
                    <p style="font-size: 12px; margin: 0px;" id="todosdate">Date</p>

                    <input type="text" id="todoInput" placeholder="New To-Do" style="margin-top: 16px; padding: 8px; border-radius: 8px; border: none; font-family: Courier;">
                    <button id="todoAddBtn" style="margin-top: 8px; padding: 8px; border-radius: 8px; border: none; cursor: pointer; font-family: Courier;">Add</button>
                    <button id="todoClearBtn" style="margin-top: 8px; padding: 8px; border-radius: 8px; border: none; cursor: pointer; font-family: Courier; background-color: #a30000; color: #fff;">Clear</button>
                </div>

                <div style="overflow-y: hidden; width: 250px; border: 3px solid black; color: #fff; border-radius: 25px; padding: 12px;" id="todoList">
                    <!-- checkboxes from JS -->
                </div>
            </div>
        </div>

        <div id="desktopApps" style="padding-top: 72px; padding-left: 16px; z-index: 10;">
            <div id="todosopen" style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content;">
                <img src="./Assets/ToDoS.jpeg" style="width: 64px; height: 64px; border-radius: 24px;">
                <p style="margin: 3px; color: #fff; border: 3px solid rgba(72, 0, 189); padding: 5px; border-radius: 25px;">ToDoS</p>
            </div>
        </div>

        <label for="wallpaperInput" id="wallpaperIcon">🖼️</label>
        <input type="file" id="wallpaperInput" accept="image/*" style="display: none;">

        <script src="script.js"></script>
        <script>
            function updateTime() {
                var currentTime = new Date();

                var timeText = document.querySelector("#topbarClock");
                var dateText = document.querySelector("#topbarDate");
                var todosText = document.querySelector("#todosdate")
                
                var currentHour = currentTime.getHours();
                var currentMinute = currentTime.getMinutes();

                var minuteStr = currentMinute < 10 ? '0' + currentMinute : currentMinute;
                var hourStr = currentHour < 10 ? '0' + currentHour : currentHour;

                var currentDay = currentTime.getDate();
                var currentMonth = currentTime.getMonth() + 1;
                var currentYear = currentTime.getFullYear();

                var dayStr = currentDay < 10 ? '0' + currentDay : currentDay;
                var monthStr = currentMonth < 10 ? '0' + currentMonth : currentMonth;

                timeText.innerHTML = `${hourStr}:${minuteStr}`;
                dateText.innerHTML = `${dayStr}/${monthStr}/${currentYear}`;
                todosText.innerHTML = `${dayStr}/${monthStr}/${currentYear}`;
            }
            setInterval(updateTime, 1000);
        </script>
    </body>
</html>
