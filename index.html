<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <script src="script.js"></script>
        

        <div id="topbar">
            <h2 style="cursor: pointer" id="welcomeopen">CircuitOS</h2>
            <h2 id="topbarClock">Time</h2>
            <h2 id="topbarDate">Date</h2>
        </div>

        <div class="window" id="welcome">
            <div class="windowheader" id="welcomeheader" style="width: 100%; height: 30px; display: flex; align-items: center; cursor: move; justify-content: space-between; border-top-right-radius: 15px; border-top-left-radius: 15px; background-color: rgb(39, 39, 39, 0.75);">
                <p style="margin-left: 15px; color: #fff; font-weight: 500">Welcome</p>
                <div class="closebutton" id="welcomeclose"><p>X</p></div>
            </div> 

            <h1 style="padding: 6px; border-radius: 8px; background-color: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px); color: #fff; margin: 20px;">Welcome to <strong style="color: blue;">CircuitOS</strong></h1>
            <h2 style="font-size: larger; color: #fff; border-bottom: 2px dashed #fff; border-top: 2px dashed #fff; border-radius: 8px; padding: 8px 16px;">Web-Based Operating System</h2>
            <p style="color: #fff;">A <strong><a href="https://stardance.hackclub.com/projects/47178">Stardance</a></strong> mission.</p>
            <p style="color: #fff;">View <a href="https://github.com/CircuitPhantom/CircuitOS">source</a></p>
        </div>


        <script src="script.js"></script>
        <script>
            function updateTime() {
                var currentTime = new Date();
                var timeText = document.querySelector("#topbarClock");
                var dateText = document.querySelector("#topbarDate");
                var currentHour = currentTime.getHours();
                var currentMinute = currentTime.getMinutes();

                var minuteStr = currentMinute < 10 ? '0' + currentMinute : currentMinute;
                var hourStr = currentHour < 10 ? '0' + currentHour : currentHour;

                var currentDay = currentTime.getDate();
                var currentMonth = currentTime.getMonth() + 1;
                var currentYear = currentTime.getFullYear();

                var dayStr = currentDay < 10 ? '0' + currentDay : currentDay;
                var monthStr = currentMonth < 10 ? '0' + currentMonth : currentMonth;

                timeText.innerHTML = `${hourStr}:${minuteStr}`;
                dateText.innerHTML = `${dayStr}/${monthStr}/${currentYear}`;
            }
            setInterval(updateTime, 1000);
        </script>
    </body>
</html>
